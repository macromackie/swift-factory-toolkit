name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: mise run check
      - run: node dist/cli.js --help
      - run: pnpm pack
